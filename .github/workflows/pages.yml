name: Publicar en GitHub Pages (manual)
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Confirmo publicar los textos y medios autorizados en el manifiesto
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # WebKit media uses Apple's playback stack here, closest to Safari.
    # Keep the full suite and all publication checks on a standard hosted runner.
    runs-on: macos-15
    env:
      VITE_BASE_PATH: /nuestro-primer-mes/
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Exigir confirmación manual
        env:
          CONFIRM_PUBLICATION: ${{ inputs.publicar }}
        run: |
          if [ "$CONFIRM_PUBLICATION" != "true" ]; then
            echo "Publicación bloqueada: no se confirmó el despliegue manual."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verificar permisos, derechos y huellas antes de construir
        run: node scripts/check-publication.mjs
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run publication:test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test -- --workers 2
      - run: npm run build
      - name: Verificar exactamente el artefacto que se subiría
        run: node scripts/check-publication.mjs --dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: false
          retention-days: 1
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
